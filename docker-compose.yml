services:
  revent.auth:
    image: ${DOCKER_REGISTRY-}reventauth
    build:
      context: .
      dockerfile: Revent.Auth/Dockerfile

  revent.webapi:
    image: ${DOCKER_REGISTRY-}reventwebapi
    build:
      context: .
      dockerfile: Revent.WebApi/Dockerfile

  postgres:
    image: postgres:16.3
    container_name: my_postgres
    environment:
      - POSTGRES_USER=myuser
      - POSTGRES_PASSWORD=mypassword
      - POSTGRES_DB=reventDb
    volumes:
      - ./DatabaseFolder/pgdata:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    networks:
      - default
  redis:
    image: redis:latest   # Use the official Redis image
    container_name: redis_cache
    ports:
      - "6379:6379"       # Redis default port
    networks:
      - default

networks:
  default:
    driver: bridge

