services:
  auth:
    image: revent-auth
    build:
      context: .
      dockerfile: Revent.Auth/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080  # Make sure your app listens on this port inside the container
    ports:
      - "8080:8080"  # Host:Container
    networks:
      - revent-network

  webapi:
    image: revent-webapi
    build:
      context: .
      dockerfile: Revent.WebApi/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080  # Ensure Web API is listening on port 8080 in the container
    ports:
      - "8082:8080"  # Host:Container (different host port to avoid conflict)
    networks:
      - revent-network

networks:
  revent-network:
    driver: bridge
